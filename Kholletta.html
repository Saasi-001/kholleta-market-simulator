<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kholleta.html — Synthetic Market Trading Terminal</title>
  <style>
    :root {
      --bg-primary: #0b0e14;
      --bg-panel: #131822;
      --bg-card: #18202e;
      --bg-input: #1e2738;
      --border: #263042;
      --green: #00d084;
      --green-hover: #00b371;
      --red: #ef4444;
      --gold: #f5b041;
      --blue: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-primary);
      color: var(--text);
      min-height: 100vh;
    }

    /* TOP HEADER */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand-logo {
      font-size: 18px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: 0.4px;
    }

    .market-select {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }

    .live-quote {
      font-size: 14px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .live-quote.up { color: var(--green); }
    .live-quote.down { color: var(--red); }

    .wallet-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-switch {
      display: flex;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--bg-card);
      color: var(--text);
    }

    .balance-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
    }

    .balance-box strong {
      color: var(--green);
      font-size: 14px;
    }

    .btn-action {
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-action:hover { border-color: var(--text); }

    .btn-deposit {
      background: rgba(0, 208, 132, 0.16);
      border-color: rgba(0, 208, 132, 0.45);
      color: #6ee7b7;
    }

    .btn-withdraw {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .btn-reset {
      background: rgba(245, 176, 65, 0.15);
      border-color: rgba(245, 176, 65, 0.45);
      color: #fcd34d;
    }

    /* PROFILE MENU */
    .profile-wrap {
      position: relative;
    }

    .profile-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .profile-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 44px;
      width: 250px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.6);
      z-index: 100;
    }

    .profile-dropdown.open {
      display: block;
    }

    .profile-meta {
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .profile-meta .p-name {
      font-size: 14px;
      font-weight: 700;
    }

    .profile-meta .p-email {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      word-break: break-all;
    }

    .profile-meta .p-role {
      display: inline-block;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: #7dd3fc;
    }

    .logout-btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.28);
    }

    /* MAIN WORKSPACE */
    .workspace {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      padding: 16px 20px;
      max-width: 1480px;
      margin: 0 auto;
    }

    @media (max-width: 1024px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .chart-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .chart-tabs {
      display: flex;
      gap: 6px;
    }

    .chart-tab {
      background: var(--bg-input);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chart-tab.active {
      background: var(--bg-card);
      color: var(--green);
      border-color: var(--green);
    }

    canvas#marketCanvas {
      width: 100%;
      height: 390px;
      display: block;
      background: #0d121a;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .tick-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
      align-items: center;
    }

    .tick-pill {
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    /* TRADING PANEL */
    .trade-form .group {
      margin-bottom: 14px;
    }

    .trade-form label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .trade-form select,
    .trade-form input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .trade-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-buy {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--green);
      color: #05110b;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-sell {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--red);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .status-toast {
      margin-top: 10px;
      font-size: 12px;
      min-height: 18px;
      color: var(--gold);
    }

    /* LOWER CONTRACTS & HISTORY */
    .lower-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 0 20px 24px;
      max-width: 1480px;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .lower-grid {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .win { color: var(--green); font-weight: 700; }
    .loss { color: var(--red); font-weight: 700; }

    /* MODAL FOR WALLET DEPOSIT / WITHDRAW */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
    }

    .modal-card h3 {
      font-size: 17px;
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div id="appShell" style="display: none;">
    <!-- TOP BAR -->
    <header class="topbar">
      <div class="brand-left">
        <div class="brand-logo">KHOLLETTA</div>
        <select id="symbolSelect" class="market-select">
          <option value="Volatility 10 Index">Volatility 10 Index</option>
          <option value="Volatility 25 Index">Volatility 25 Index</option>
          <option value="Volatility 50 Index">Volatility 50 Index</option>
          <option value="Volatility 75 Index">Volatility 75 Index</option>
          <option value="Volatility 100 Index">Volatility 100 Index</option>
        </select>
        <div id="livePriceBadge" class="live-quote up">1000.00</div>
      </div>

      <div class="wallet-bar">
        <div class="mode-switch">
          <button type="button" class="mode-btn active" id="modeRealBtn" onclick="setAccountMode('real')">Real</button>
          <button type="button" class="mode-btn" id="modeDemoBtn" onclick="setAccountMode('demo')">Demo</button>
        </div>

        <div class="balance-box">
          <span id="activeAccountLabel">Real</span>: <strong id="activeBalanceDisplay">$0.00</strong>
        </div>

        <!-- Real Account Controls -->
        <div id="realWalletActions" style="display: flex; gap: 6px;">
          <button type="button" class="btn-action btn-deposit" onclick="openWalletModal('DEPOSIT')">+ Deposit</button>
          <button type="button" class="btn-action btn-withdraw" onclick="openWalletModal('WITHDRAW')">- Withdraw</button>
        </div>

        <!-- Demo Account Controls -->
        <div id="demoWalletActions" style="display: none; gap: 6px;">
          <button type="button" class="btn-action btn-reset" onclick="resetDemoAccount()">Reset Demo ($10,000)</button>
        </div>

        <!-- Profile Menu -->
        <div class="profile-wrap">
          <button type="button" class="profile-trigger" id="profileMenuBtn" onclick="toggleProfileMenu(event)">
            <span id="traderNameDisplay">Trader</span>
            <span>▾</span>
          </button>
          <div class="profile-dropdown" id="profileDropdown">
            <div class="profile-meta">
              <div class="p-name" id="menuFullName">Trader</div>
              <div class="p-email" id="menuEmail">-</div>
              <span class="p-role" id="menuRole">trader</span>
            </div>
            <button type="button" class="logout-btn" id="logoutBtn">Log Out</button>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN CHART + TRADING PANEL -->
    <main class="workspace">
      <section class="panel">
        <div class="chart-toolbar">
          <div class="chart-tabs">
            <button type="button" class="chart-tab active" id="tabTick" onclick="setChartMode('tick')">Tick Chart</button>
            <button type="button" class="chart-tab" id="tabCandle" onclick="setChartMode('candle')">1m Candles</button>
          </div>
          <div style="font-size: 12px; color: var(--muted);">
            Last Digit: <strong id="lastDigitBadge" style="color: var(--gold);">0</strong>
          </div>
        </div>

        <canvas id="marketCanvas" width="900" height="390"></canvas>

        <div class="tick-bar" id="recentDigitsBar">
          <span style="font-size: 11px; color: var(--muted);">Recent Digits:</span>
        </div>
      </section>

      <aside class="panel trade-form">
        <h2 class="section-title">Trade Execution</h2>

        <div class="group">
          <label for="contractType">Contract Type</label>
          <select id="contractType" onchange="updatePredictionVisibility()">
            <option value="RISE_FALL">Rise / Fall</option>
            <option value="MATCH_DIFF">Matches / Differs</option>
            <option value="EVEN_ODD">Even / Odd</option>
            <option value="OVER_UNDER">Over / Under (4.5)</option>
          </select>
        </div>

        <div class="group" id="digitGroup" style="display: none;">
          <label for="targetDigit">Target Digit (0 - 9)</label>
          <select id="targetDigit">
            <option value="0">0</option><option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option><option value="5">5</option>
            <option value="6">6</option><option value="7">7</option><option value="8">8</option>
            <option value="9">9</option>
          </select>
        </div>

        <div class="group">
          <label for="stakeInput">Stake (USD)</label>
          <input type="number" id="stakeInput" value="10" min="0.5" step="0.5" />
        </div>

        <div class="group">
          <label for="ticksInput">Duration (Ticks)</label>
          <input type="number" id="ticksInput" value="5" min="1" max="50" step="1" />
        </div>

        <div class="trade-buttons">
          <button type="button" class="btn-buy" id="primaryActionBtn" onclick="placeTrade('PRIMARY')">RISE / HIGHER</button>
          <button type="button" class="btn-sell" id="secondaryActionBtn" onclick="placeTrade('SECONDARY')">FALL / LOWER</button>
        </div>

        <div class="status-toast" id="tradeStatus"></div>
      </aside>
    </main>

    <!-- OPEN CONTRACTS & HISTORY -->
    <section class="lower-grid">
      <div class="panel">
        <h3 class="section-title">Open Contracts</h3>
        <div id="openContractsList">
          <div style="font-size: 12px; color: var(--muted);">No active contracts.</div>
        </div>
      </div>

      <div class="panel">
        <h3 class="section-title">Trade History</h3>
        <div id="tradeHistoryList">
          <div style="font-size: 12px; color: var(--muted);">No settled trades yet.</div>
        </div>
      </div>
    </section>
  </div>

  <!-- WALLET DEPOSIT / WITHDRAW MODAL -->
  <div class="modal-backdrop" id="walletModal">
    <div class="modal-card">
      <h3 id="walletModalTitle">Real Wallet Deposit</h3>
      <div class="group" style="margin-bottom: 12px;">
        <label style="display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase;">
          Amount (USD)
        </label>
        <input
          type="number"
          id="walletAmountInput"
          placeholder="Enter amount"
          min="1"
          step="0.01"
          style="width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px;"
        />
      </div>
      <div id="walletModalError" style="font-size: 12px; color: #fca5a5; min-height: 16px;"></div>
      <div class="modal-actions">
        <button type="button" class="btn-action" style="flex: 1; padding: 10px;" onclick="closeWalletModal()">Cancel</button>
        <button type="button" class="btn-buy" style="flex: 1; padding: 10px;" id="confirmWalletBtn" onclick="submitWalletAction()">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://kjnlicbnpejlliqrhwkh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_OuWu0qozlwjD1RxTxfiazQ_te7vUolu';
    const INDEX_PAGE = 'index.html';
    const DEMO_DEFAULT_BALANCE = 10000.00;

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;
    let realBalance = 0.00;
    let demoBalance = DEMO_DEFAULT_BALANCE;
    let accountMode = 'real'; // 'real' | 'demo'
    let walletModalType = 'DEPOSIT';

    // Market simulation state
    let chartMode = 'tick';
    let price = 1000.00;
    let prevPrice = 1000.00;
    const ticks = [1000.00];
    const digits = [0];
    const candles = [{ open: 1000, high: 1000, low: 1000, close: 1000 }];
    let openContracts = [];
    let tradeHistory = [];

    function formatMoney(n) {
      return '$' + (Number(n) || 0).toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function updateWalletUI() {
      const isReal = accountMode === 'real';
      document.getElementById('modeRealBtn').classList.toggle('active', isReal);
      document.getElementById('modeDemoBtn').classList.toggle('active', !isReal);
      document.getElementById('activeAccountLabel').textContent = isReal ? 'Real' : 'Demo';
      document.getElementById('activeBalanceDisplay').textContent = formatMoney(isReal ? realBalance : demoBalance);
      document.getElementById('realWalletActions').style.display = isReal ? 'flex' : 'none';
      document.getElementById('demoWalletActions').style.display = isReal ? 'none' : 'flex';
    }

    window.setAccountMode = function (mode) {
      accountMode = mode;
      updateWalletUI();
    };

    window.toggleProfileMenu = function (e) {
      e.stopPropagation();
      document.getElementById('profileDropdown').classList.toggle('open');
    };

    document.addEventListener('click', () => {
      document.getElementById('profileDropdown').classList.remove('open');
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = INDEX_PAGE;
    });

    // Real Wallet Deposit / Withdraw
    window.openWalletModal = function (type) {
      walletModalType = type;
      document.getElementById('walletModalTitle').textContent =
        type === 'DEPOSIT' ? 'Deposit to Real Wallet' : 'Withdraw from Real Wallet';
      document.getElementById('walletAmountInput').value = '';
      document.getElementById('walletModalError').textContent = '';
      document.getElementById('walletModal').classList.add('open');
      document.getElementById('walletAmountInput').focus();
    };

    window.closeWalletModal = function () {
      document.getElementById('walletModal').classList.remove('open');
    };

    window.submitWalletAction = async function () {
      const amount = parseFloat(document.getElementById('walletAmountInput').value);
      const errEl = document.getElementById('walletModalError');

      if (isNaN(amount) || amount <= 0) {
        errEl.textContent = 'Enter a valid amount greater than 0.';
        return;
      }

      if (walletModalType === 'WITHDRAW' && amount > realBalance) {
        errEl.textContent = `Insufficient real balance (${formatMoney(realBalance)}).`;
        return;
      }

      const nextBalance = walletModalType === 'DEPOSIT'
        ? Math.round((realBalance + amount) * 100) / 100
        : Math.round((realBalance - amount) * 100) / 100;

      const { error } = await supabase
        .from('profiles')
        .update({ balance: nextBalance })
        .eq('id', currentUser.id);

      if (error) {
        errEl.textContent = 'Database update failed: ' + error.message;
        return;
      }

      await supabase.from('cashier_transactions').insert({
        user_id: currentUser.id,
        user_email: currentProfile.email || currentUser.email,
        user_name: currentProfile.full_name || 'Trader',
        tx_type: walletModalType,
        amount,
        balance_after: nextBalance,
        note: 'Trader self-service wallet action'
      });

      realBalance = nextBalance;
      updateWalletUI();
      closeWalletModal();
      document.getElementById('tradeStatus').textContent =
        `${walletModalType === 'DEPOSIT' ? 'Deposited' : 'Withdrew'} ${formatMoney(amount)} to Real Wallet.`;
    };

    // Demo Account Reset
    window.resetDemoAccount = function () {
      demoBalance = DEMO_DEFAULT_BALANCE;
      updateWalletUI();
      document.getElementById('tradeStatus').textContent = 'Demo account reset to $10,000.00.';
    };

    // Chart Tabs & Contract Controls
    window.setChartMode = function (mode) {
      chartMode = mode;
      document.getElementById('tabTick').classList.toggle('active', mode === 'tick');
      document.getElementById('tabCandle').classList.toggle('active', mode === 'candle');
      drawChart();
    };

    window.updatePredictionVisibility = function () {
      const cType = document.getElementById('contractType').value;
      const showDigit = cType === 'MATCH_DIFF';
      document.getElementById('digitGroup').style.display = showDigit ? 'block' : 'none';

      const buyBtn = document.getElementById('primaryActionBtn');
      const sellBtn = document.getElementById('secondaryActionBtn');

      if (cType === 'RISE_FALL') {
        buyBtn.textContent = 'RISE / HIGHER';
        sellBtn.textContent = 'FALL / LOWER';
      } else if (cType === 'MATCH_DIFF') {
        buyBtn.textContent = 'MATCHES';
        sellBtn.textContent = 'DIFFERS';
      } else if (cType === 'EVEN_ODD') {
        buyBtn.textContent = 'EVEN';
        sellBtn.textContent = 'ODD';
      } else {
        buyBtn.textContent = 'OVER 4.5';
        sellBtn.textContent = 'UNDER 4.5';
      }
    };

    async function persistRealBalance(newBal) {
      const rounded = Math.max(0, Math.round(newBal * 100) / 100);
      realBalance = rounded;
      updateWalletUI();
      await supabase
        .from('profiles')
        .update({ balance: rounded })
        .eq('id', currentUser.id);
    }

    window.placeTrade = async function (direction) {
      const stake = parseFloat(document.getElementById('stakeInput').value);
      const duration = parseInt(document.getElementById('ticksInput').value, 10);
      const cType = document.getElementById('contractType').value;
      const digit = parseInt(document.getElementById('targetDigit').value, 10);
      const statusEl = document.getElementById('tradeStatus');

      if (isNaN(stake) || stake <= 0) {
        statusEl.textContent = 'Enter a valid stake.';
        return;
      }

      const activeBal = accountMode === 'real' ? realBalance : demoBalance;
      if (stake > activeBal) {
        statusEl.textContent = `Insufficient ${accountMode} balance (${formatMoney(activeBal)}).`;
        return;
      }

      if (accountMode === 'real') {
        await persistRealBalance(realBalance - stake);
      } else {
        demoBalance = Math.round((demoBalance - stake) * 100) / 100;
        updateWalletUI();
      }

      openContracts.push({
        id: 'CTR-' + Date.now() + '-' + Math.floor(Math.random() * 100),
        mode: accountMode,
        contractType: cType,
        direction,
        targetDigit: digit,
        stake,
        entrySpot: price,
        remainingTicks: Math.max(1, duration || 5)
      });

      statusEl.textContent = `Opened ${stake.toFixed(2)} USD ${accountMode.toUpperCase()} contract.`;
      renderContracts();
    };

    function evaluateContract(ctr, exitPrice, exitDigit) {
      if (ctr.contractType === 'RISE_FALL') {
        return ctr.direction === 'PRIMARY' ? exitPrice > ctr.entrySpot : exitPrice < ctr.entrySpot;
      }
      if (ctr.contractType === 'MATCH_DIFF') {
        return ctr.direction === 'PRIMARY' ? exitDigit === ctr.targetDigit : exitDigit !== ctr.targetDigit;
      }
      if (ctr.contractType === 'EVEN_ODD') {
        const isEven = exitDigit % 2 === 0;
        return ctr.direction === 'PRIMARY' ? isEven : !isEven;
      }
      // OVER_UNDER (4.5)
      return ctr.direction === 'PRIMARY' ? exitDigit > 4 : exitDigit < 5;
    }

    async function stepMarket() {
      prevPrice = price;
      const volatilityMap = {
        'Volatility 10 Index': 0.35,
        'Volatility 25 Index': 0.75,
        'Volatility 50 Index': 1.4,
        'Volatility 75 Index': 2.3,
        'Volatility 100 Index': 3.5
      };
      const sym = document.getElementById('symbolSelect').value;
      const vol = volatilityMap[sym] || 1.2;
      const delta = (Math.random() - 0.495) * vol;
      price = Math.max(100, Math.round((price + delta) * 100) / 100);

      const formattedStr = price.toFixed(2);
      const lastDigit = parseInt(formattedStr[formattedStr.length - 1], 10);

      ticks.push(price);
      if (ticks.length > 90) ticks.shift();

      digits.push(lastDigit);
      if (digits.length > 12) digits.shift();

      const lastCandle = candles[candles.length - 1];
      lastCandle.close = price;
      lastCandle.high = Math.max(lastCandle.high, price);
      lastCandle.low = Math.min(lastCandle.low, price);
      if (ticks.length % 10 === 0) {
        candles.push({ open: price, high: price, low: price, close: price });
        if (candles.length > 45) candles.shift();
      }

      const quoteEl = document.getElementById('livePriceBadge');
      quoteEl.textContent = formattedStr;
      quoteEl.className = `live-quote ${price >= prevPrice ? 'up' : 'down'}`;
      document.getElementById('lastDigitBadge').textContent = lastDigit;

      document.getElementById('recentDigitsBar').innerHTML =
        '<span style="font-size: 11px; color: var(--muted);">Recent Digits:</span>' +
        digits.map((d) => `<span class="tick-pill" style="color:${d % 2 === 0 ? 'var(--green)' : 'var(--blue)'}">${d}</span>`).join('');

      // Process open contracts
      const stillOpen = [];
      for (const ctr of openContracts) {
        ctr.remainingTicks -= 1;
        if (ctr.remainingTicks <= 0) {
          const won = evaluateContract(ctr, price, lastDigit);
          const payout = won ? Math.round(ctr.stake * 1.92 * 100) / 100 : 0;
          const net = Math.round((payout - ctr.stake) * 100) / 100;

          if (ctr.mode === 'real') {
            await persistRealBalance(realBalance + payout);
          } else {
            demoBalance = Math.round((demoBalance + payout) * 100) / 100;
            updateWalletUI();
          }

          tradeHistory.unshift({
            ...ctr,
            won,
            payout,
            net,
            time: new Date().toLocaleTimeString()
          });
          if (tradeHistory.length > 25) tradeHistory.pop();
        } else {
          stillOpen.push(ctr);
        }
      }
      openContracts = stillOpen;

      renderContracts();
      drawChart();
    }

    function renderContracts() {
      const openEl = document.getElementById('openContractsList');
      const histEl = document.getElementById('tradeHistoryList');

      if (!openContracts.length) {
        openEl.innerHTML = '<div style="font-size: 12px; color: var(--muted);">No active contracts.</div>';
      } else {
        openEl.innerHTML = openContracts.map((c) => `
          <div class="list-item">
            <div>
              <strong>${c.contractType}</strong> (${c.mode.toUpperCase()})<br/>
              <span style="color: var(--muted);">Stake: ${formatMoney(c.stake)}</span>
            </div>
            <div>Ticks left: <strong>${c.remainingTicks}</strong></div>
          </div>
        `).join('');
      }

      if (!tradeHistory.length) {
        histEl.innerHTML = '<div style="font-size: 12px; color: var(--muted);">No settled trades yet.</div>';
      } else {
        histEl.innerHTML = tradeHistory.map((h) => `
          <div class="list-item">
            <div>
              <strong>${h.contractType}</strong> (${h.mode.toUpperCase()})<br/>
              <span style="color: var(--muted);">${h.time}</span>
            </div>
            <div class="${h.won ? 'win' : 'loss'}">
              ${h.won ? '+' + formatMoney(h.net) : formatMoney(h.net)}
            </div>
          </div>
        `).join('');
      }
    }

    function drawChart() {
      const canvas = document.getElementById('marketCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      if (chartMode === 'tick') {
        const minVal = Math.min(...ticks);
        const maxVal = Math.max(...ticks);
        const range = Math.max(0.2, maxVal - minVal);

        ctx.strokeStyle = '#00d084';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ticks.forEach((val, idx) => {
          const x = (idx / Math.max(1, ticks.length - 1)) * (w - 40) + 20;
          const y = h - 25 - ((val - minVal) / range) * (h - 55);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      } else {
        const lows = candles.map((c) => c.low);
        const highs = candles.map((c) => c.high);
        const minVal = Math.min(...lows);
        const maxVal = Math.max(...highs);
        const range = Math.max(0.3, maxVal - minVal);
        const stepW = (w - 40) / Math.max(1, candles.length);

        candles.forEach((c, idx) => {
          const x = 20 + idx * stepW + stepW * 0.5;
          const openY = h - 25 - ((c.open - minVal) / range) * (h - 55);
          const closeY = h - 25 - ((c.close - minVal) / range) * (h - 55);
          const highY = h - 25 - ((c.high - minVal) / range) * (h - 55);
          const lowY = h - 25 - ((c.low - minVal) / range) * (h - 55);
          const bull = c.close >= c.open;

          ctx.strokeStyle = bull ? '#00d084' : '#ef4444';
          ctx.fillStyle = bull ? '#00d084' : '#ef4444';

          ctx.beginPath();
          ctx.moveTo(x, highY);
          ctx.lineTo(x, lowY);
          ctx.stroke();

          const bodyH = Math.max(2, Math.abs(closeY - openY));
          ctx.fillRect(x - stepW * 0.28, Math.min(openY, closeY), stepW * 0.56, bodyH);
        });
      }
    }

    async function initSimulator() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session || !session.user) {
        window.location.href = INDEX_PAGE;
        return;
      }

      currentUser = session.user;

      const { data: profile, error } = await supabase
        .from('profiles')
        .select('id, full_name, email, balance, role, status')
        .eq('id', currentUser.id)
        .single();

      if (error || !profile) {
        window.location.href = INDEX_PAGE;
        return;
      }

      if (profile.status === 'suspended') {
        await supabase.auth.signOut();
        window.location.href = INDEX_PAGE;
        return;
      }

      currentProfile = profile;
      realBalance = Number(profile.balance) || 0.00;
      demoBalance = DEMO_DEFAULT_BALANCE;

      const displayName = profile.full_name || profile.email || 'Trader';
      document.getElementById('traderNameDisplay').textContent = displayName;
      document.getElementById('menuFullName').textContent = displayName;
      document.getElementById('menuEmail').textContent = profile.email || currentUser.email;
      document.getElementById('menuRole').textContent = profile.role || 'trader';

      document.getElementById('appShell').style.display = 'block';
      updateWalletUI();
      updatePredictionVisibility();
      drawChart();

      // Keep real balance synced if adjusted by Admin Cashier
      supabase
        .channel('trader-balance-sync')
        .on(
          'postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${currentUser.id}` },
          (payload) => {
            if (payload.new && typeof payload.new.balance !== 'undefined') {
              realBalance = Number(payload.new.balance) || 0.00;
              updateWalletUI();
            }
          }
        )
        .subscribe();

      setInterval(stepMarket, 1000);
    }

    initSimulator();
  </script>
</body>
