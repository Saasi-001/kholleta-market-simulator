<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kholleta Market Simulator — Trader & Broker Portal</title>
  <style>
    :root {
      --bg-primary: #0b0e14;
      --bg-card: #131822;
      --bg-input: #1a2130;
      --border-color: #263042;
      --accent-green: #00d084;
      --accent-green-hover: #00b371;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #162033, var(--bg-primary) 65%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-badge {
      display: inline-block;
      background: rgba(0, 208, 132, 0.12);
      color: var(--accent-green);
      border: 1px solid rgba(0, 208, 132, 0.3);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-input);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-green);
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--accent-green);
      color: #06110c;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-primary:hover {
      background: var(--accent-green-hover);
    }

    .alert-box {
      display: none;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .alert-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert-box.success {
      display: block;
      background: rgba(0, 208, 132, 0.12);
      border: 1px solid rgba(0, 208, 132, 0.4);
      color: #6ee7b7;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="brand-header">
      <span class="brand-badge">Supabase Cloud Database</span>
      <h1>Kholleta Market</h1>
      <p>Sign in or create a trader account</p>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabLogin">Sign In</button>
      <button type="button" class="tab-btn" id="tabRegister">Create Account</button>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="Enter your email address" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <!-- CREATE ACCOUNT FORM -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label for="regFullName">Full Name</label>
        <input type="text" id="regFullName" placeholder="Enter your full name" required autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" placeholder="Enter your email address" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="Create a password (min. 6 chars)" minlength="6" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-primary">Create Trader Account</button>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://kjnlicbnpejlliqrhwkh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_OuWu0qozlwjD1RxTxfiazQ_te7vUolu';
    const SIMULATOR_PAGE = 'kholletta.html';
    const ADMIN_PAGE = 'admin.html';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, flowType: 'pkce' }
    });

    // Supabase consumes the confirmation code during client initialization.
    // The configured emailRedirectTo points back to this login page.
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const authError = params.get('error_description') || hash.get('error_description');
      const isConfirmationReturn = params.has('code') || hash.get('type') === 'signup';
      if (authError) {
        showAlert(authError);
        return;
      }
      if (isConfirmationReturn) {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) await supabase.auth.signOut();
        showAlert('Email confirmed successfully. Please sign in.', 'success');
        history.replaceState({}, document.title, window.location.pathname);
      }
    })();

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const alertBox = document.getElementById('alertBox');

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = `alert-box ${type}`;
    }

    function clearAlert() {
      alertBox.textContent = '';
      alertBox.className = 'alert-box';
    }

    tabLogin.addEventListener('click', () => {
      clearAlert();
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
    });

    tabRegister.addEventListener('click', () => {
      clearAlert();
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
    });

    // Sign Up -> Creates Auth User + Profile Row in public.profiles
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const fullName = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;

      const redirectTo = new URL('index.html', window.location.href).href;
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName },
          emailRedirectTo: redirectTo
        }
      });

      if (error) {
        showAlert(error.message || 'Could not create account.');
        return;
      }

      if (!data.session) {
        showAlert('Account created. Check your email to confirm, then sign in to continue.', 'success');
        return;
      }

      showAlert(`Account created for ${fullName}! Launching simulator...`, 'success');
      setTimeout(() => {
        window.location.href = SIMULATOR_PAGE;
      }, 400);
    });

    // Sign In -> Checks public.profiles.role and routes Admin vs Trader
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error || !data.user) {
        showAlert(error?.message || 'Invalid email or password.');
        return;
      }

      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('role, status, full_name')
        .eq('id', data.user.id)
        .single();

      if (profileError) {
        showAlert('Signed in, but could not load profile: ' + profileError.message);
        return;
      }

      if (profile.status === 'suspended') {
        await supabase.auth.signOut();
        showAlert('Your account has been suspended.');
        return;
      }

      if (profile.role === 'admin') {
        showAlert('Admin verified. Opening Admin Panel...', 'success');
        setTimeout(() => {
          window.location.href = ADMIN_PAGE;
        }, 350);
      } else {
        showAlert(`Welcome back, ${profile.full_name || 'Trader'}! Launching simulator...`, 'success');
        setTimeout(() => {
          window.location.href = SIMULATOR_PAGE;
        }, 350);
      }
    });
  </script>
</body>
</html>
