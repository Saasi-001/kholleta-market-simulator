<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kholleta Market Simulator — Trader & Broker Portal</title>
  <style>
    :root {
      --bg-primary: #0b0e14;
      --bg-card: #131822;
      --bg-input: #1a2130;
      --border-color: #263042;
      --accent-green: #00d084;
      --accent-green-hover: #00b371;
      --accent-gold: #f5b041;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #162033, var(--bg-primary) 65%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-badge {
      display: inline-block;
      background: rgba(0, 208, 132, 0.12);
      color: var(--accent-green);
      border: 1px solid rgba(0, 208, 132, 0.3);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-input);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 22px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent-green);
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--accent-green);
      color: #06110c;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 6px;
    }

    .btn-primary:hover {
      background: var(--accent-green-hover);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin: 20px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider:not(:empty)::before {
      margin-right: 12px;
    }

    .divider:not(:empty)::after {
      margin-left: 12px;
    }

    .btn-guest {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-guest:hover {
      background: var(--bg-input);
      border-color: var(--text-muted);
    }

    .alert-box {
      display: none;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .alert-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert-box.success {
      display: block;
      background: rgba(0, 208, 132, 0.12);
      border: 1px solid rgba(0, 208, 132, 0.4);
      color: #6ee7b7;
    }

    .hidden {
      display: none;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 22px;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="brand-header">
      <span class="brand-badge">Synthetic Volatility Engine</span>
      <h1>Kholleta Market</h1>
      <p>Sign in to access your live trading terminal</p>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      <button type="button" class="tab-btn" id="tabRegister" onclick="switchTab('register')">Create Account</button>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="form-group">
        <label for="loginUsername">Username or Email</label>
        <input type="text" id="loginUsername" placeholder="Enter username or email" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary">Sign In to Terminal</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="e.g. Alex Trader" required />
      </div>
      <div class="form-group">
        <label for="regUsername">Username</label>
        <input type="text" id="regUsername" placeholder="Choose a unique username" required />
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="Create a password" required />
      </div>
      <div class="form-group">
        <label for="regDeposit">Initial Virtual Deposit (USD)</label>
        <input type="number" id="regDeposit" value="10000" min="100" max="100000" step="100" required />
      </div>
      <button type="submit" class="btn-primary">Create Trader Account</button>
    </form>

    <div class="divider">OR</div>

    <button type="button" class="btn-guest" onclick="loginAsGuest()">
      Continue with Instant $10,000 Demo Account
    </button>

    <div class="footer-note">
      Kholleta Liquidity Pool &amp; Settlement Engine v16
    </div>
  </div>

  <script>
    // =========================================================================
    // SHARED BROKER BACKEND CONFIGURATION (Synchronized with simulator & admin)
    // =========================================================================
    const STORAGE_KEY = 'kholleta_broker_backend_v1';
    const SIMULATOR_PAGE = 'Kholleta_Market_simulator-v16.html';
    const ADMIN_PAGE = 'admin.html';

    // Admin Credentials Configuration
    const ADMIN_CREDENTIALS = {
      username: 'admin',
      password: 'admin123' // Change this password as needed
    };

    function getBrokerState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          return JSON.parse(raw);
        } catch (e) {
          console.error('Corrupted broker storage, resetting...', e);
        }
      }
      const initialState = {
        brokerPool: 10000000.00, // $10,000,000 Liquidity Pool
        brokerNetPnL: 0.00,
        users: [],
        ledger: [],
        trades: [],
        activeSession: null
      };
      saveBrokerState(initialState);
      return initialState;
    }

    function saveBrokerState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showAlert(message, type = 'error') {
      const box = document.getElementById('alertBox');
      box.textContent = message;
      box.className = `alert-box ${type}`;
    }

    function clearAlert() {
      const box = document.getElementById('alertBox');
      box.className = 'alert-box';
      box.textContent = '';
    }

    function switchTab(tab) {
      clearAlert();
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        tabLogin.classList.remove('active');
        tabRegister.classList.add('active');
      }
    }

    // =========================================================================
    // LOGIN HANDLER (Routes Admin Credentials Directly to admin.html)
    // =========================================================================
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      clearAlert();

      const usernameInput = document.getElementById('loginUsername').value.trim();
      const passwordInput = document.getElementById('loginPassword').value;
      const state = getBrokerState();

      // 1. Check Admin Credentials First
      if (
        usernameInput.toLowerCase() === ADMIN_CREDENTIALS.username.toLowerCase() &&
        passwordInput === ADMIN_CREDENTIALS.password
      ) {
        state.activeSession = {
          role: 'admin',
          username: ADMIN_CREDENTIALS.username,
          loginTime: new Date().toISOString()
        };
        saveBrokerState(state);
        sessionStorage.setItem('kholleta_role', 'admin');

        showAlert('Admin authenticated. Redirecting to Broker Admin Panel...', 'success');
        setTimeout(() => {
          window.location.href = ADMIN_PAGE;
        }, 400);
        return;
      }

      // 2. Check Registered Trader Accounts
      const matchedUser = state.users.find(
        (u) =>
          (u.username.toLowerCase() === usernameInput.toLowerCase() ||
            (u.email && u.email.toLowerCase() === usernameInput.toLowerCase())) &&
          u.password === passwordInput
      );

      if (!matchedUser) {
        showAlert('Invalid username or password. Please check your credentials.');
        return;
      }

      if (matchedUser.status === 'suspended') {
        showAlert('This trading account has been suspended by the broker administrator.');
        return;
      }

      state.activeSession = {
        role: 'trader',
        userId: matchedUser.id,
        username: matchedUser.username,
        loginTime: new Date().toISOString()
      };
      saveBrokerState(state);
      sessionStorage.setItem('kholleta_role', 'trader');

      showAlert(`Welcome back, ${matchedUser.name || matchedUser.username}! Launching terminal...`, 'success');
      setTimeout(() => {
        window.location.href = SIMULATOR_PAGE;
      }, 400);
    });

    // =========================================================================
    // REGISTRATION HANDLER
    // =========================================================================
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      clearAlert();

      const name = document.getElementById('regName').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const initialDeposit = parseFloat(document.getElementById('regDeposit').value) || 10000;

      if (username.toLowerCase() === ADMIN_CREDENTIALS.username.toLowerCase()) {
        showAlert('That username is reserved. Please choose another username.');
        return;
      }

      const state = getBrokerState();
      const exists = state.users.some((u) => u.username.toLowerCase() === username.toLowerCase());

      if (exists) {
        showAlert('Username already exists. Please sign in or pick a different username.');
        return;
      }

      const newUser = {
        id: 'TRD-' + Date.now(),
        name: name,
        username: username,
        password: password,
        balance: initialDeposit,
        status: 'active',
        createdAt: new Date().toISOString()
      };

      state.users.push(newUser);
      state.ledger.unshift({
        id: 'TXN-' + Date.now(),
        userId: newUser.id,
        username: newUser.username,
        type: 'DEPOSIT',
        amount: initialDeposit,
        note: 'Initial Account Funding',
        timestamp: new Date().toISOString()
      });

      state.activeSession = {
        role: 'trader',
        userId: newUser.id,
        username: newUser.username,
        loginTime: new Date().toISOString()
      };

      saveBrokerState(state);
      sessionStorage.setItem('kholleta_role', 'trader');

      showAlert('Account created! Redirecting to Kholleta Market Simulator...', 'success');
      setTimeout(() => {
        window.location.href = SIMULATOR_PAGE;
      }, 500);
    });

    // =========================================================================
    // INSTANT DEMO / GUEST ACCESS
    // =========================================================================
    function loginAsGuest() {
      const state = getBrokerState();
      let guestUser = state.users.find((u) => u.username === 'demo_trader');

      if (!guestUser) {
        guestUser = {
          id: 'TRD-DEMO-001',
          name: 'Demo Trader',
          username: 'demo_trader',
          password: '',
          balance: 10000.00,
          status: 'active',
          createdAt: new Date().toISOString()
        };
        state.users.push(guestUser);
      }

      state.activeSession = {
        role: 'trader',
        userId: guestUser.id,
        username: guestUser.username,
        isGuest: true,
        loginTime: new Date().toISOString()
      };

      saveBrokerState(state);
      sessionStorage.setItem('kholleta_role', 'trader');
      window.location.href = SIMULATOR_PAGE;
    }

    // Initialize storage on page load
    getBrokerState();
  </script>
</body>
</html>
