<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kholleta — Login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2048%2048%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%2338bdf8%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%2322c55e%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%2248%22%20height=%2248%22%20rx=%2212%22%20fill=%22url(%23g)%22/%3E%3Cpath%20d=%22M16%2011v26M17%2025L32%2012M17%2024l16%2013%22%20stroke=%22%230f172a%22%20stroke-width=%225%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%20fill=%22none%22/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
      --success: #22c55e;
      --danger: #fb7185;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.12), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(34, 197, 94, 0.10), transparent 45%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Brand Header (Matches Simulator) */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.25));
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .brand-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand-sub {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #082f49;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      color: #082f49;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
      transition: filter 0.15s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      margin: 18px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider span {
      padding: 0 10px;
    }

    .btn-guest {
      width: 100%;
      background: rgba(148, 163, 184, 0.1);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-guest:hover {
      background: rgba(148, 163, 184, 0.18);
    }

    .message {
      font-size: 0.84rem;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      font-weight: 600;
    }

    .message.error {
      display: block;
      background: rgba(251, 113, 133, 0.14);
      border: 1px solid rgba(251, 113, 133, 0.4);
      color: #fda4af;
    }

    .message.success {
      display: block;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .footer-note {
      text-align: center;
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <header class="brand">
      <svg class="brand-logo" viewBox="0 0 48 48" role="img" aria-label="Kholleta logo" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#38bdf8"/>
            <stop offset="1" stop-color="#22c55e"/>
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="12" fill="url(#kg)"/>
        <path d="M16 11v26M17 25L32 12M17 24l16 13" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Kholleta</span>
        <span class="brand-sub">Market Simulator</span>
      </div>
    </header>

    <main class="card">
      <div class="tabs">
        <button id="loginTab" class="tab-btn active" type="button">Sign In</button>
        <button id="registerTab" class="tab-btn" type="button">Create Account</button>
      </div>

      <div id="statusMsg" class="message"></div>

      <form id="authForm">
        <div class="form-group" id="nameGroup" style="display: none;">
          <label for="usernameInput">Trader Name</label>
          <input id="usernameInput" type="text" placeholder="e.g. Alex Trader" autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="emailInput">Email Address</label>
          <input id="emailInput" type="email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input id="passwordInput" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button id="submitBtn" class="btn-primary" type="submit">Launch Simulator</button>
      </form>

      <div class="divider"><span>OR</span></div>

      <button id="guestBtn" class="btn-guest" type="button">Continue as Demo Guest ($10,000)</button>
    </main>

    <p class="footer-note">
      Synthetic Volatility Indices &bull; Manual &amp; Auto Trading<br />
      Virtual demo environment. No real funds are involved.
    </p>
  </div>

  <script>
    // Make sure this matches your exact simulator filename in the folder/repo
    const SIMULATOR_FILE = "Kholleta_Market_simulator-v13.html";
    const ADMIN_PAGE = "admin.html";

    // Change these admin login credentials before hosting publicly
    const ADMIN_CONFIG = {
      email: "admin@kholleta.com",
      password: "admin123",
      name: "System Administrator"
    };

    let isRegisterMode = false;

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const nameGroup = document.getElementById("nameGroup");
    const usernameInput = document.getElementById("usernameInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");
    const authForm = document.getElementById("authForm");
    const guestBtn = document.getElementById("guestBtn");

    function showMessage(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = "message " + type;
    }

    function setMode(register) {
      isRegisterMode = register;
      loginTab.classList.toggle("active", !register);
      registerTab.classList.toggle("active", register);
      nameGroup.style.display = register ? "block" : "none";
      usernameInput.required = register;
      submitBtn.textContent = register ? "Create Account & Enter" : "Launch Simulator";
      statusMsg.className = "message";
    }

    loginTab.addEventListener("click", () => setMode(false));
    registerTab.addEventListener("click", () => setMode(true));

    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem("kholleta_users") || "{}");
      } catch {
        return {};
      }
    }

    function saveUsers(users) {
      localStorage.setItem("kholleta_users", JSON.stringify(users));
    }

    function launchApp(userObj, targetUrl) {
      localStorage.setItem("kholleta_active_session", JSON.stringify({
        ...userObj,
        loggedInAt: Date.now()
      }));
      window.location.href = targetUrl;
    }

    authForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      const name = usernameInput.value.trim();
      const users = getUsers();

      // Check for Admin login first
      if (!isRegisterMode && email === ADMIN_CONFIG.email && password === ADMIN_CONFIG.password) {
        showMessage("Admin verified. Opening Admin Console...", "success");
        setTimeout(() => {
          launchApp({ name: ADMIN_CONFIG.name, email, role: "admin" }, ADMIN_PAGE);
        }, 500);
        return;
      }

      if (isRegisterMode) {
        if (email === ADMIN_CONFIG.email || users[email]) {
          showMessage("An account with this email already exists. Please sign in.", "error");
          return;
        }
        if (password.length < 4) {
          showMessage("Password must be at least 4 characters.", "error");
          return;
        }
        users[email] = { name: name || email.split("@")[0], email, password, role: "user" };
        saveUsers(users);
        showMessage("Account created! Redirecting to simulator...", "success");
        setTimeout(() => launchApp(users[email], SIMULATOR_FILE), 600);
      } else {
        const user = users[email];
        if (!user || user.password !== password) {
          showMessage("Invalid email or password. Create an account or use Demo Guest.", "error");
          return;
        }
        showMessage("Welcome back, " + user.name + "! Launching...", "success");
        setTimeout(() => launchApp(user, SIMULATOR_FILE), 500);
      }
    });

    guestBtn.addEventListener("click", () => {
      launchApp({ name: "Demo Guest", email: "guest@kholleta.local", role: "guest" }, SIMULATOR_FILE);
    });
  </script>
</body>
</html>
